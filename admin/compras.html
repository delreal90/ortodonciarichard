<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A2E4A">
<title>Compras y Stock — Ortodoncia Richard</title>
<style>
  :root{
    --navy:#1A2E4A; --navy-light:#243C5E; --navy-dark:#111E30;
    --gold:#C9A84C; --gold-light:#D4B870;
    --white:#fff; --light-bg:#F0F5FB; --card:#fff;
    --text-dark:#1A2535; --text-mid:#4A5568; --line:#E2E8F0;
    --ok:#2F855A; --ok-bg:#F0FFF4; --warn:#C05621; --warn-bg:#FFFAF0;
    --danger:#C53030; --danger-bg:#FFF5F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
       background:var(--light-bg);color:var(--text-dark);line-height:1.5;font-size:15px}
  button{font-family:inherit;cursor:pointer;border:none;font-size:14px}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:9px 11px;
       border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text-dark)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold)}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-mid);margin:0 0 4px;
       text-transform:uppercase;letter-spacing:.03em}
  a{color:var(--navy-light)}

  /* Botones */
  .btn{padding:10px 16px;border-radius:8px;font-weight:600;background:var(--navy);color:#fff;
       display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:.15s}
  .btn:hover{background:var(--navy-light)}
  .btn.gold{background:var(--gold);color:var(--navy-dark)}
  .btn.gold:hover{background:var(--gold-light)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--light-bg)}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* Layout */
  header.top{background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;
       justify-content:space-between;height:56px;position:sticky;top:0;z-index:20}
  header.top .brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
  header.top .brand small{font-weight:400;opacity:.7;font-size:12px}
  header.top .user{font-size:13px;display:flex;align-items:center;gap:12px}
  .rolechip{background:var(--gold);color:var(--navy-dark);padding:2px 9px;border-radius:20px;
       font-size:11px;font-weight:700;text-transform:uppercase}
  nav.tabs{background:var(--navy-dark);display:flex;gap:2px;padding:0 10px;overflow-x:auto;
       position:sticky;top:56px;z-index:19}
  nav.tabs button{background:transparent;color:#cbd5e0;padding:13px 16px;font-weight:600;
       border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
  nav.tabs button:hover{color:#fff}
  .badge{background:var(--danger);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:3px}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 80px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;
       margin-bottom:16px;box-shadow:0 1px 3px rgba(26,46,74,.05)}
  .card h2{font-size:17px;margin-bottom:4px;color:var(--navy)}
  .card .sub{color:var(--text-mid);font-size:13px;margin-bottom:14px}
  .row{display:grid;gap:12px}
  @media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}
       .row.c4{grid-template-columns:repeat(4,1fr)}}
  .field{margin-bottom:12px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-mid);font-weight:700}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--light-bg)}
  .tablewrap{overflow-x:auto}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.fijo{background:#EBF4FF;color:#2B6CB0}
  .pill.variable{background:#FAF5FF;color:#805AD5}
  .pill.recurrente{background:#E6FFFA;color:#2C7A7B}
  .pill.low{background:var(--danger-bg);color:var(--danger)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}

  .muted{color:var(--text-mid)}
  .right{text-align:right}
  .flex{display:flex;align-items:center;gap:10px}
  .flex.wrap{flex-wrap:wrap}
  .spacer{flex:1}
  .hidden{display:none!important}

  /* Buscador con dropdown */
  .search{position:relative}
  .search .results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);
       border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;max-height:260px;overflow-y:auto;margin-top:4px}
  .search .results div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
  .search .results div:hover{background:var(--light-bg)}
  .search .results div.add{color:var(--navy);font-weight:600}

  /* Ítems de compra */
  .item-row{display:grid;grid-template-columns:1fr 120px 70px 100px 90px 34px;gap:8px;align-items:center;margin-bottom:8px}
  .item-row .sub{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .item-head{font-size:11px;text-transform:uppercase;color:var(--text-mid);font-weight:700}
  .item-x{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:8px;text-align:center;cursor:pointer}
  @media(max-width:639px){.item-row{grid-template-columns:1fr 60px 90px;grid-auto-rows:auto}
       .item-row .marca{grid-column:1/4}.item-row .sub{grid-column:1/3}.item-x{grid-column:3}.item-head{display:none}}

  /* Toast */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;
       flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--navy-dark);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
       box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
  .toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(17,30,48,.55);z-index:50;display:flex;
       align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:22px}
  .modal h3{color:var(--navy);margin-bottom:14px}

  /* Login */
  .login{max-width:380px;margin:8vh auto;padding:0 16px}
  .login .card{padding:26px}
  .login h1{font-size:20px;color:var(--navy);margin-bottom:4px}

  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .tile .n{font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  .tile .l{font-size:12px;color:var(--text-mid);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}

  /* Barras de reporte */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
  .bar .lab{width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .track{flex:1;background:var(--light-bg);border-radius:6px;height:22px;position:relative;overflow:hidden}
  .bar .fill{background:var(--gold);height:100%;border-radius:6px}
  .bar .val{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

  .scanbox{background:var(--navy-dark);border-radius:12px;padding:16px;text-align:center;color:#fff}
  #video{width:100%;max-width:360px;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}
  .empty{text-align:center;color:var(--text-mid);padding:30px 10px}
</style>
</head>
<body>

<!-- LOGIN / SETUP -->
<div id="auth" class="login hidden">
  <div class="card">
    <h1 id="authTitle">Compras y Stock</h1>
    <p class="sub muted" id="authSub">Ingresa con tu cuenta.</p>
    <div id="setupNombre" class="field hidden">
      <label>Nombre</label><input id="inNombre" autocomplete="name">
    </div>
    <div class="field"><label>Email</label><input id="inEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input id="inPass" type="password" autocomplete="current-password"></div>
    <button class="btn gold" style="width:100%" id="btnAuth">Entrar</button>
    <p class="muted" style="font-size:12px;margin-top:12px" id="authHint"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">🦷 Compras <small>Ortodoncia Richard</small></div>
    <div class="user">
      <span id="uName"></span><span class="rolechip" id="uRole"></span>
      <button class="btn ghost sm" id="btnLogout">Salir</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="compras">➕ Nueva compra</button>
    <button data-tab="historial">📋 Historial</button>
    <button data-tab="stock">📦 Stock</button>
    <button data-tab="escanear">📷 Escanear salida</button>
    <button data-tab="solicitudes">🛒 Solicitudes <span id="badgePend" class="badge hidden">0</span></button>
    <button data-tab="recurrentes">🔁 Recurrentes</button>
    <button data-tab="reportes">📊 Reportes</button>
    <button data-tab="admin">⚙️ Administración</button>
  </nav>
  <main>
    <section id="tab-compras" class="hidden"></section>
    <section id="tab-historial" class="hidden"></section>
    <section id="tab-stock" class="hidden"></section>
    <section id="tab-escanear" class="hidden"></section>
    <section id="tab-solicitudes" class="hidden"></section>
    <section id="tab-recurrentes" class="hidden"></section>
    <section id="tab-reportes" class="hidden"></section>
    <section id="tab-admin" class="hidden"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="compras.js"></script>
</body>
</html>
