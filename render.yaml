services:
  - type: web
    name: ortodonciarichard-backend
    runtime: python
    rootDir: admin
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --worker-class gthread --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DENTIDESK_EMAIL
        sync: false
      - key: DENTIDESK_PASSWORD
        sync: false
      - key: DENTIDESK_BASIC_USER
        sync: false
      - key: DENTIDESK_BASIC_PASS
        sync: false
      # WhatsApp Cloud API (Meta) — valores se cargan en el panel de Render, nunca en el repo.
      # Los IDs (WABA, Phone Number ID de prueba) estan en DATOS-PRIVADOS.md, gitignored.
      - key: WA_ENABLED
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      # Webhook entrante (botones tocados por el paciente): firma de Meta + handshake.
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      # Ficha de Primera Consulta (Google Form -> base de pacientes). El id del
      # Google Sheet apunta a datos de pacientes; va como env var (esta en
      # DATOS-PRIVADOS.md), NUNCA en el repo publico. Sin el, el modulo queda
      # apagado. Lee con la misma cuenta de servicio de GOOGLE_SERVICE_ACCOUNT_JSON.
      - key: FICHA_SHEET_ID
        sync: false
